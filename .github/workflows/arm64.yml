name: arm64

# Linux ARM64: the tests, then the archive and the Debian package, tested
# as shipped. A workflow of its own: if no ARM64 runner is available, ci
# is not held up.
# Started by hand, like ci (gh workflow run arm64.yml --ref main).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PDFKILN_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fontconfig

      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chromium.json') }}

      - run: npm ci
      - run: npm run build
      - run: npm run fetch:chromium
      - run: pip install -r bench/requirements.txt

      - name: AppArmor profile for Chromium
        run: |
          exe="$(node dist/scripts/fetch-chromium.js)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile pdfkiln-chromium %s flags=(unconfined) {\n  userns,\n}\n' "$exe" \
            | sudo tee /etc/apparmor.d/pdfkiln-chromium
          sudo apparmor_parser -r /etc/apparmor.d/pdfkiln-chromium

      - name: Unit tests
        run: node --test dist/test/options.test.js dist/test/parse.test.js dist/test/units.test.js dist/test/messages.test.js dist/test/emulation.test.js dist/test/version.test.js dist/test/unzip.test.js

      - name: Command tests
        run: node --test dist/test/cli.test.js

      - name: Archive and Debian package
        run: |
          npm run bundle
          node dist/scripts/sea.js
          node dist/scripts/package.js
          node dist/scripts/deb.js

      - name: Command tests on the Debian package
        run: |
          sudo apt-get install -y ./dist/package/pdfkiln_*_arm64.deb
          # No file of the package writable by another user than root.
          if dpkg -L pdfkiln | xargs -d '\n' stat -c '%A %n' | grep -E '^[^l](....w|.......w)'; then exit 1; fi
          /usr/bin/wkhtmltopdf --version
          PDFKILN_TEST_WKHTMLTOPDF=/usr/bin/wkhtmltopdf PDFKILN_TEST_PDFKILN=/usr/bin/pdfkiln node --test dist/test/cli.test.js

      # Provenance, as in ci.yml: skipped while the repository is private.
      - name: Provenance (public repository)
        if: ${{ !github.event.repository.private }}
        run: cat dist/package/*.sha256 > "$RUNNER_TEMP/subjects.sha256"

      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-arm64
          path: |
            dist/package/*.tar.gz
            dist/package/*.deb
            dist/package/*.sha256
          retention-days: 2
