name: Setup PDFKiln
description: Install PDFKiln, the drop-in replacement for wkhtmltopdf powered by Chromium, and put wkhtmltopdf, wkhtmltoimage and pdfkiln on the PATH
author: Jamal Tantaoui
branding:
  icon: file-text
  color: orange
inputs:
  version:
    description: The pdfkiln release to install, such as 1.1.0, or latest
    default: latest
  token:
    description: The token that asks the GitHub API for the latest release
    default: ${{ github.token }}
outputs:
  version:
    description: The version installed
    value: ${{ steps.setup.outputs.version }}
  path:
    description: The folder of wkhtmltopdf, wkhtmltoimage and pdfkiln
    value: ${{ steps.setup.outputs.path }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
      env:
        PDFKILN_VERSION: ${{ inputs.version }}
        PDFKILN_TOKEN: ${{ inputs.token }}
